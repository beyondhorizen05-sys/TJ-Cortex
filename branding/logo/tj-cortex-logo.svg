<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="TJ-Cortex">
  <defs>
    <linearGradient id="cortexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C4CF1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="revenueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="neuralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(10,10)">
    <circle cx="50" cy="50" r="48" fill="url(#neuralGlow)"/>
    <!-- Brain outline -->
    <path d="M22 44c0-14 12-24 28-24s28 10 28 24c0 6-2 11-6 15 1 4 0 9-3 12-2 2-5 3-8 3-2 5-8 8-14 6-4 5-11 5-15 1-4-4-5-10-3-15-5-5-7-12-7-22z"
          fill="none" stroke="url(#cortexGrad)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Neural nodes -->
    <circle cx="34" cy="40" r="2.4" fill="#22D3EE"/>
    <circle cx="50" cy="32" r="2.4" fill="#6C4CF1"/>
    <circle cx="66" cy="40" r="2.4" fill="#22D3EE"/>
    <circle cx="30" cy="58" r="2.4" fill="#6C4CF1"/>
    <circle cx="50" cy="62" r="2.4" fill="#22D3EE"/>
    <circle cx="70" cy="58" r="2.4" fill="#6C4CF1"/>
    <!-- Neural connections -->
    <path d="M34 40 L50 32 L66 40 M30 58 L34 40 M50 32 L50 62 M66 40 L70 58 M50 62 L30 58 M50 62 L70 58"
          stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.2" fill="none"/>
    <!-- Village house inside the brain -->
    <g transform="translate(43,46)">
      <path d="M0 8 L7 2 L14 8 L14 16 L0 16 Z" fill="#0B0B14" stroke="#F8FAFC" stroke-width="1.4"/>
      <rect x="5" y="10" width="4" height="6" fill="#F59E0B"/>
    </g>
    <!-- Coin glyph woven into a pathway -->
    <g transform="translate(60,26)">
      <circle cx="6" cy="6" r="6" fill="url(#revenueGrad)"/>
      <path d="M6 3v6M4 5h4M4 7h4" stroke="#0B0B14" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(120,0)">
    <text x="0" y="72"
          font-family="'Space Grotesk', Inter, sans-serif"
          font-weight="700" font-size="44" letter-spacing="1"
          fill="#F8FAFC">TJ<tspan fill="#22D3EE">-</tspan>CORTEX</text>
    <text x="2" y="92"
          font-family="Inter, sans-serif"
          font-size="11" letter-spacing="3.4" fill="#64748B">THINK · CONNECT · BUILD · EARN</text>
  </g>
</svg>