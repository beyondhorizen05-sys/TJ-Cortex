name: TJ-Cortex CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  typecheck-build:
    name: Typecheck and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install native Node dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm --filter @tj-cortex/sidecar run build
      - run: pnpm --filter @tj-cortex/ui run build

  tauri-windows:
    name: Windows installer
    needs: typecheck-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tj-cortex/sidecar run build
      - run: pnpm --filter @tj-cortex/ui run build
      - run: pnpm --filter @tj-cortex/desktop tauri icon ../../branding/app-icons/icon.svg
      - run: pnpm --filter @tj-cortex/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: tj-cortex-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  tauri-linux:
    name: Linux packages
    needs: typecheck-build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libsecret-1-dev
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @tj-cortex/sidecar run build
      - run: pnpm --filter @tj-cortex/ui run build
      - run: pnpm --filter @tj-cortex/desktop tauri icon ../../branding/app-icons/icon.svg
      - run: pnpm --filter @tj-cortex/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: tj-cortex-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
