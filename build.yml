name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: typecheck + workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r run typecheck
      - run: pnpm --filter @tj-cortex/sidecar run build
      - run: pnpm --filter @tj-cortex/ui run build

  tauri-linux:
    name: tauri build (linux)
    needs: typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libsecret-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "desktop/src-tauri -> target" }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @tj-cortex/sidecar run build
      - run: pnpm --filter @tj-cortex/ui run build
      - name: generate icons
        run: pnpm --filter @tj-cortex/desktop tauri icon ../../branding/app-icons/icon.svg
      - name: build tauri bundle
        run: pnpm --filter @tj-cortex/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: tj-cortex-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  tauri-windows:
    name: tauri build (windows)
    needs: typecheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "desktop/src-tauri -> target" }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @tj-cortex/sidecar run build
      - run: pnpm --filter @tj-cortex/ui run build
      - name: generate icons
        run: pnpm --filter @tj-cortex/desktop tauri icon ../../branding/app-icons/icon.svg
      - name: build tauri bundle
        run: pnpm --filter @tj-cortex/desktop tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: tj-cortex-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn